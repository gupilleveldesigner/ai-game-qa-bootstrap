name: Import standalone repository

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-standalone.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Import skill directory as repository root
        shell: bash
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          git clone --depth 1 --branch add/ai-game-qa-bootstrap \
            https://github.com/gupilleveldesigner/awesome-claude-skills.git \
            "$temp_dir/source"

          source_root="$temp_dir/source/ai-game-qa-bootstrap"
          test -f "$source_root/SKILL.md"
          test -f "$source_root/package.json"

          find . -mindepth 1 -maxdepth 1 \
            ! -name .git \
            ! -name .github \
            -exec rm -rf {} +

          cp -a "$source_root"/. .
          npm test

          rm -f .github/workflows/import-standalone.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: import standalone AI game QA bootstrap"
          git push origin HEAD:main
